; SmartBus Master - standard ESP32 build for the connected 4 MB board.
; TFT assets and NAPT are intentionally omitted.

[platformio]
default_envs = master_4mb
core_dir = C:/.pio-napt

[env:master_4mb]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
;extra_scripts = ../pio_esptool_python.py

; The connected module reports a physical flash capacity of 4 MB.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv

build_flags =
  -D WEBSOCKETS_SERVER_CLIENT_MAX=15

lib_deps =
  fastled/FastLED
  links2004/WebSockets @ ^2.6.1
  bblanchon/ArduinoJson @ ^6.21.0

upload_speed = 115200
monitor_speed = 115200
